<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PicGallery - Studio &amp; Client Workspace">

  <!-- Google Sign-In: required for google_sign_in web plugin -->
  <meta name="google-signin-client_id"
        content="608395495309-b4kfrmpr1pc7sea8grjnnkbn7j2gc7gj.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="picgallery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>picgallery</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prevent the browser from zooming the page on trackpad pinch.
    // On Windows Chrome/Edge, a two-finger trackpad pinch fires 'wheel' events
    // with ctrlKey=true. We preventDefault() to stop the entire browser UI
    // from zooming, but we DO NOT stop propagation so Flutter still receives
    // the event as a PointerScrollEvent.
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
