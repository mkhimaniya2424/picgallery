<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PicGallery — Shared Album</title>
<meta name="robots" content="noindex" />
<style>
  :root { --grad-a: #7C3AED; --grad-b: #EC4899; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f14; color: #fff;
  }
  .hero {
    padding: 28px 20px 90px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; opacity: .9; margin-bottom: 22px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .sub { font-size: 14px; opacity: .85; margin: 0; }
  .card {
    background: #17171f; border-radius: 18px; margin: -60px 16px 0; padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #26262f; }
  .more-tile {
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: #fff; font-weight: 600; font-size: 14px;
    aspect-ratio: 1 / 1;
  }
  .meta { font-size: 13px; color: #9a9aa5; margin-bottom: 16px; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    padding: 14px 16px; border-radius: 12px; font-weight: 700; font-size: 15px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: #fff;
    margin-bottom: 10px;
  }
  .btn.secondary { background: #24242e; color: #cfcfd8; font-weight: 600; }
  .status { padding: 40px 20px; text-align: center; color: #cfcfd8; font-size: 15px; line-height: 1.5; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-note { text-align: center; font-size: 12px; color: #6d6d78; padding: 18px 20px 28px; }
</style>
</head>
<body>

<div class="hero">
  <div class="brand"><span class="dot"></span> PicGallery</div>
  <h1 id="heroTitle">Opening your shared album…</h1>
  <p class="sub" id="heroSub">Hang tight a second.</p>
</div>

<div class="card" id="card">
  <div class="status">
    <div class="spinner"></div>
    <div id="statusText">Checking the link…</div>
  </div>
</div>

<p class="footer-note">This link only works with albums shared from PicGallery.</p>

<script>
(function () {
  // ---- Config -------------------------------------------------------
  var APP_PACKAGE = 'com.mk.picgallery';
  var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=' + APP_PACKAGE;
  // Relative to wherever this page is served from — it's now served by
  // the same FastAPI service the /api/v1 routes live on (see main.py),
  // so this works unchanged across prod/staging/local without editing.
  var API_BASE = window.location.origin + '/api/v1';
  var APP_OPEN_WAIT_MS = 1500; // how long we give the OS to switch to the app

  // ---- Token extraction ----------------------------------------------
  // Works whether this file is served at /shared/<token> via a rewrite
  // rule, or the token is passed as ?token=<token>.
  function getToken() {
    var qp = new URLSearchParams(window.location.search);
    if (qp.get('token')) return qp.get('token');
    var parts = window.location.pathname.split('/').filter(Boolean);
    // .../shared/<token>  -> take the segment right after "shared"
    var idx = parts.indexOf('shared');
    if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]);
    return parts.length ? decodeURIComponent(parts[parts.length - 1]) : null;
  }

  var token = getToken();
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  var heroTitle = document.getElementById('heroTitle');
  var heroSub = document.getElementById('heroSub');
  var card = document.getElementById('card');
  var statusText = document.getElementById('statusText');

  function showPlainMessage(title, sub, message, showInstallBtn) {
    heroTitle.textContent = title;
    heroSub.textContent = sub || '';
    var html = '<div class="status" style="padding:24px 4px;">' + message + '</div>';
    if (showInstallBtn) {
      html += '<a class="btn" href="' + PLAY_STORE_URL + '">Get the PicGallery app</a>';
    }
    card.innerHTML = html;
  }

  if (!token) {
    showPlainMessage(
      'Link not recognized',
      "This doesn't look like a valid PicGallery share link.",
      "We couldn't find an album to open.",
      true
    );
    return;
  }

  // ---- Step 1: try to hand off to the installed app -------------------
  // Android: an intent:// URL does both jobs in one shot — Chrome opens
  // the app directly if it's installed, and silently falls through to
  // browser_fallback_url (the Play Store) if it isn't. Nothing else
  // needs to run in that case.
  var appHandoffAttempted = false;
  var appLikelyOpened = false;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) appLikelyOpened = true;
  });

  function attemptAppHandoff() {
    appHandoffAttempted = true;
    if (isAndroid) {
      var intentUrl =
        'intent://shared/' + encodeURIComponent(token) +
        '#Intent;scheme=https;package=' + APP_PACKAGE +
        ';S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE_URL) + ';end';
      window.location.href = intentUrl;
    } else if (isIOS) {
      window.location.href = 'picgallery://shared/' + encodeURIComponent(token);
    }
    // Desktop/other: no native app to hand off to — page content below
    // (or the fallback timer) is the only experience.
  }

  attemptAppHandoff();

  // ---- Step 2: build the web fallback while the handoff races --------
  // If the app opens, the tab backgrounds and none of this matters.
  // If it doesn't (not installed, desktop, or an in-app browser that
  // blocks intent:// / custom schemes), we render this instead.
  function renderFallback() {
    if (appLikelyOpened || document.hidden) return; // app took over — leave it alone

    fetch(API_BASE + '/public/share-links/' + encodeURIComponent(token) + '/status')
      .then(function (r) {
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (status) {
        if (appLikelyOpened || document.hidden) return;

        if (!status.is_active) {
          showPlainMessage(
            'This link is no longer available',
            'It may have expired or been removed by the photographer.',
            'Ask them to send a new link.',
            true
          );
          return;
        }

        if (status.requires_password) {
          // Password-protected — we can't safely preview it on the web,
          // so skip straight to "get the app" per design.
          showPlainMessage(
            'Password-protected album',
            'Open this link in the PicGallery app to view it.',
            'This gallery is protected — the app is needed to unlock it.',
            true
          );
          return;
        }

        // Public and active — show a real preview.
        fetch(API_BASE + '/public/share-links/' + encodeURIComponent(token))
          .then(function (r) {
            if (!r.ok) throw new Error('gallery ' + r.status);
            return r.json();
          })
          .then(renderGalleryPreview)
          .catch(function () {
            showPlainMessage(
              'PicGallery',
              'View this shared album in the app.',
              "We couldn't load a preview right now.",
              true
            );
          });
      })
      .catch(function () {
        showPlainMessage(
          'PicGallery',
          'View this shared album in the app.',
          "We couldn't check this link right now — you can still open it in the app.",
          true
        );
      });
  }

  function renderGalleryPreview(data) {
    if (appLikelyOpened || document.hidden) return;

    var album = data.album || {};
    var mediaList = data.media || [];
    var grad = (album.gradient_argb && album.gradient_argb.length >= 2)
      ? argbListToCss(album.gradient_argb)
      : null;
    if (grad) document.documentElement.style.setProperty('--grad-a', grad[0]);
    if (grad) document.documentElement.style.setProperty('--grad-b', grad[grad.length - 1]);

    heroTitle.textContent = album.name || 'Shared album';
    heroSub.textContent = mediaList.length + (mediaList.length === 1 ? ' photo' : ' photos') +
      (album.description ? ' · ' + album.description : '');

    var preview = mediaList.slice(0, 6);
    var gridHtml = '<div class="grid">';
    preview.forEach(function (m, i) {
      var thumb = m.thumbnail_url || m.file_url;
      if (i === 5 && mediaList.length > 6) {
        gridHtml += '<div style="position:relative;">' +
          '<img src="' + thumb + '" alt="" />' +
          '<div class="more-tile" style="position:absolute;inset:0;">+' + (mediaList.length - 5) + '</div>' +
          '</div>';
      } else {
        gridHtml += '<img src="' + thumb + '" alt="" loading="lazy" />';
      }
    });
    gridHtml += '</div>';

    var deepLink = 'picgallery://shared/' + encodeURIComponent(token);
    var installThenOpen = PLAY_STORE_URL + '&referrer=' + encodeURIComponent('shared_token=' + token);

    card.innerHTML =
      gridHtml +
      '<div class="meta">Shared via PicGallery' + (data.requires_password ? ' · Protected' : '') + '</div>' +
      '<a class="btn" href="' + (isAndroid ? deepLink : PLAY_STORE_URL) + '">Open in PicGallery app</a>' +
      '<a class="btn secondary" href="' + installThenOpen + '">Don\'t have the app? Get it on Google Play</a>';
  }

  function argbListToCss(list) {
    // Album gradient_argb entries are ARGB ints (0xAARRGGBB).
    return list.map(function (argb) {
      var a = (argb >>> 24) & 0xff, r = (argb >>> 16) & 0xff, g = (argb >>> 8) & 0xff, b = argb & 0xff;
      return 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 255).toFixed(2) + ')';
    });
  }

  // Give the OS a moment to switch to the app before we commit to
  // rendering the web fallback — avoids a flash of preview content
  // right before the app takes over.
  setTimeout(renderFallback, APP_OPEN_WAIT_MS);
})();
</script>
</body>
</html>
